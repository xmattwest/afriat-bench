[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afriat-bench"
version = "2.0.0"
description = "Dual-track benchmark for moral, affective, revealed-preference (GARP/CCEI), and fiduciary rationality in LLM economic agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface-hub>=0.28",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
afriat-bench = "afriat_bench.cli:main"
afriat-bench-audit = "afriat_bench.schema:main_audit"

[tool.hatch.build.targets.wheel]
packages = ["afriat_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
